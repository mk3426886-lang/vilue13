<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | فيليو</title>
  <link rel="icon" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <main class="welcome-screen">
    <div class="welcome-top">
      <div class="brand">
        <img class="brand-mark" src="assets/icons/logo-mark.svg" alt="Vilue" width="34" height="34" style="border-radius:10px;">
        <span data-i18n="common.appName">فيليو</span>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang-option="ar">العربية</button>
        <button type="button" data-lang-option="en">English</button>
      </div>
    </div>

    <div class="welcome-hero">
      <div class="welcome-illustration" id="welcome-illustration" aria-hidden="true"></div>
      <h1 data-i18n="welcome.tagline">محفظتك الرقمية بلمسة عصرية</h1>
      <p data-i18n="welcome.subtitle">أرسل، استلم، وتسوّق داخل فيليو بأمان وسهولة تامة.</p>
    </div>

    <div class="welcome-actions">
      <a class="btn btn-primary" href="pages/login.html" data-i18n="welcome.login">تسجيل الدخول</a>
      <a class="btn btn-outline" href="pages/register.html" data-i18n="welcome.createAccount">إنشاء حساب جديد</a>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    function updateRateBadge() {
      Vilue_Utils.qs('#welcome-illustration').setAttribute('data-rate', Vilue_I18n.t('welcome.rate'));
    }
    document.addEventListener('vilue:app-ready', updateRateBadge);
    document.addEventListener('vilue:language-changed', updateRateBadge);
  </script>
</body>
</html>
