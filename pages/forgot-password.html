<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | استعادة كلمة المرور</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="auth-form-screen">
    <div class="auth-form-top">
      <button class="back-btn" type="button" onclick="history.back()" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="auth-form-body">
      <h1 class="auth-title">نسيت كلمة المرور؟</h1>
      <p class="auth-subtitle">أدخل بريدك الإلكتروني وسنرسل لك رمز تحقق لإعادة تعيين كلمة المرور</p>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label class="field-label" for="email">البريد الإلكتروني</label>
          <input class="field-input" id="email" type="email" placeholder="أدخل بريدك الإلكتروني" required dir="ltr">
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">إرسال رمز التحقق</button>
      </form>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('vilue:app-ready', () => {
      Vilue_Utils.qs('#forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = Vilue_Utils.qs('#submit-btn');
        const email = Vilue_Utils.qs('#email').value.trim();
        if (!Vilue_Utils.isValidEmail(email)) {
          Vilue_Utils.showToast('أدخل بريداً إلكترونياً صحيحاً', 'error');
          return;
        }
        Vilue_Utils.setLoading(submitBtn, true);
        try {
          await Vilue_Api.request('/auth/forgot-password', { method: 'POST', body: { email, lang: Vilue_I18n.getLang() } });
          sessionStorage.setItem('vilue_reset_email', email);
          Vilue_Utils.showToast('إذا كان بريدك مسجّلاً، وصلك رمز التحقق', 'success');
          setTimeout(() => { window.location.href = 'reset-password.html'; }, 1000);
        } catch (err) {
          Vilue_Utils.showToast(err.message, 'error');
        } finally {
          Vilue_Utils.setLoading(submitBtn, false);
          submitBtn.textContent = 'إرسال رمز التحقق';
        }
      });
    });
  </script>
</body>
</html>
