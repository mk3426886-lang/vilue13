<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | الرئيسية</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <img class="brand-mark" src="../assets/icons/logo-mark.svg" alt="Vilue" width="30" height="30" style="border-radius:9px;">
        <span data-i18n="common.appName">فيليو</span>
      </div>
      <div class="topbar-actions">
        <a class="icon-btn" href="notifications.html" aria-label="Notifications" style="text-decoration:none; color:inherit;">
          <span class="dot" id="notif-dot" style="display:none;"></span>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 3a5 5 0 0 0-5 5v2.7c0 .6-.2 1.2-.6 1.7L5 15h14l-1.4-2.6c-.4-.5-.6-1.1-.6-1.7V8a5 5 0 0 0-5-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </a>
        <div class="avatar" style="width:38px;height:38px;font-size:14px;">س</div>
      </div>
    </header>

    <div class="container">
      <div class="balance-card">
        <div class="balance-label">رصيد سلون</div>
        <div class="balance-amount" id="balance-slon">—</div>
        <div class="balance-sub" id="balance-iqd">—</div>
      </div>

      <div class="quick-actions">
        <a class="quick-action" href="deposit.html" style="text-decoration:none;">
          <span class="qa-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          إيداع
        </a>
        <a class="quick-action" href="withdraw.html" style="text-decoration:none;">
          <span class="qa-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M12 19l-6-6M12 19l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          سحب
        </a>
        <a class="quick-action" href="transfer.html" style="text-decoration:none;">
          <span class="qa-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 8h13M7 8l4-4M7 8l4 4M17 16H4M17 16l-4-4M17 16l-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          تحويل
        </a>
        <a class="quick-action" href="wallet.html" style="text-decoration:none;">
          <span class="qa-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          السجل
        </a>
      </div>

      <div class="news-ticker" id="news-ticker" style="display:none;">
        <span class="tag">جديد</span>
        <span class="msg" id="news-ticker-text"></span>
      </div>

      <div class="promo-banner" id="promo-banner" style="display:none;">أرسل هدية لصديقك اليوم</div>

      <div class="section-header">
        <h2>آخر المعاملات</h2>
        <a href="wallet.html">عرض الكل</a>
      </div>

      <div id="tx-preview">
        <div class="card" style="text-align:center; padding: var(--sp-8) var(--sp-5); color: var(--color-text-muted);">
          <p style="font-size: var(--fs-sm);">جارِ التحميل...</p>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html" class="is-active">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9h12v-9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        الرئيسية
      </a>
      <a href="wallet.html">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 13h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        المحفظة
      </a>
      <a href="friends.html">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.8"/><path d="M16 11l1.5 1.5L21 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        الأصدقاء
      </a>
      <a href="marketplace.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 8l8-4 8 4-8 4-8-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 8v8l8 4 8-4V8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        المتجر
      </a>
      <a href="profile.html">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="currentColor" stroke-width="1.8"/></svg>
        الحساب
      </a>
    </nav>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/wallet.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const TX_LABELS = {
      deposit: 'إيداع', withdrawal: 'سحب', transfer_in: 'تحويل مستلم',
      transfer_out: 'تحويل مرسل', fee: 'رسوم', gift_sent: 'هدية مرسلة', gift_received: 'هدية مستلمة',
    };
    const STATUS_LABELS = {
      pending: 'قيد المراجعة', processing: 'قيد المعالجة', approved: 'تمت الموافقة',
      completed: 'مكتمل', rejected: 'مرفوض', cancelled: 'ملغى',
    };
    const INCOMING_TYPES = new Set(['deposit', 'transfer_in', 'gift_received']);

    function renderTxPreview(rows) {
      const container = Vilue_Utils.qs('#tx-preview');
      if (!rows.length) {
        container.innerHTML = `<div class="card" style="text-align:center; padding: var(--sp-8) var(--sp-5); color: var(--color-text-muted);">
          <p style="font-size: var(--fs-sm);">لا توجد معاملات بعد.</p></div>`;
        return;
      }
      container.innerHTML = rows.slice(0, 3).map((tx) => {
        const isIn = INCOMING_TYPES.has(tx.type);
        const sign = isIn ? '+' : '-';
        const iconClass = isIn ? 'in' : (tx.status === 'pending' || tx.status === 'processing' ? 'neutral' : 'out');
        const arrow = isIn
          ? '<path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
          : '<path d="M12 5v14M12 19l-6-6M12 19l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
        const date = new Date(tx.created_at).toLocaleString('ar-IQ', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
        return `
          <div class="tx-row">
            <div class="tx-icon ${iconClass}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none">${arrow}</svg></div>
            <div class="tx-info">
              <div class="tx-title">${TX_LABELS[tx.type] || tx.type}</div>
              <div class="tx-meta">${date}</div>
            </div>
            <div style="text-align:end;">
              <div class="tx-amount ${isIn ? 'in' : 'out'}">‎${sign}${Vilue_Utils.formatSlon(tx.amount_slon)}</div>
              <span class="tx-status ${tx.status === 'completed' ? 'completed' : 'pending'}">${STATUS_LABELS[tx.status] || tx.status}</span>
            </div>
          </div>`;
      }).join('');
    }

    document.addEventListener('vilue:app-ready', async () => {
      if (!Vilue_Auth.isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }

      const user = await Vilue_Auth.loadSession();
      if (user) {
        Vilue_Utils.qs('.avatar').textContent = user.name ? user.name.trim().charAt(0) : '؟';
      }

      try {
        const wallet = await Vilue_Wallet.getMyWallet();
        Vilue_Utils.qs('#balance-slon').innerHTML =
          `${Vilue_Utils.formatSlon(wallet.balanceSlon)} <span style="font-size:16px;">سلون</span>`;
        Vilue_Utils.qs('#balance-iqd').textContent =
          `≈ ${Vilue_Utils.formatSlon(wallet.balanceIqd)} دينار عراقي`;
      } catch (err) {
        Vilue_Utils.qs('#balance-slon').textContent = '—';
        Vilue_Utils.qs('#balance-iqd').textContent =
          err.code === 'BACKEND_UNREACHABLE'
            ? 'تعذّر الاتصال بالسيرفر'
            : 'تعذّر تحميل الرصيد';
      }

      try {
        const { transactions } = await Vilue_Wallet.getMyTransactions();
        renderTxPreview(transactions);
      } catch (err) {
        Vilue_Utils.qs('#tx-preview').innerHTML = `<div class="card" style="text-align:center; padding: var(--sp-6); color: var(--color-text-muted); font-size: var(--fs-sm);">تعذّر تحميل المعاملات</div>`;
      }

      try {
        const { settings } = await Vilue_Api.request('/settings/public');
        if (settings.news_ticker_text) {
          Vilue_Utils.qs('#news-ticker-text').textContent = settings.news_ticker_text;
          Vilue_Utils.qs('#news-ticker').style.display = 'flex';
        }
        if (settings.promo_banner_text || settings.promo_banner_image_url) {
          const banner = Vilue_Utils.qs('#promo-banner');
          banner.style.display = 'flex';
          if (settings.promo_banner_image_url) {
            banner.style.backgroundImage = `url('${settings.promo_banner_image_url}')`;
            banner.style.backgroundSize = 'cover';
            banner.style.backgroundPosition = 'center';
          }
          if (settings.promo_banner_text) banner.textContent = settings.promo_banner_text;
        }
      } catch (err) { /* banner/ticker are optional — fail silently */ }

      try {
        const { count } = await Vilue_Notifications.unreadCount();
        if (count > 0) Vilue_Utils.qs('#notif-dot').style.display = 'block';
      } catch (err) { /* non-critical */ }
    });
  </script>
</body>
</html>
