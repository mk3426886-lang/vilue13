<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | إعادة تعيين كلمة المرور</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="auth-form-screen">
    <div class="auth-form-top">
      <button class="back-btn" type="button" onclick="history.back()" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="auth-form-body">
      <h1 class="auth-title">إعادة تعيين كلمة المرور</h1>
      <p class="auth-subtitle">أدخل الرمز المرسل لإيميلك وكلمة المرور الجديدة</p>

      <form id="reset-form" novalidate>
        <div class="field">
          <label class="field-label" for="code">رمز التحقق</label>
          <input class="field-input" id="code" type="text" inputmode="numeric" maxlength="6" placeholder="6 أرقام" dir="ltr" required>
        </div>
        <div class="field">
          <label class="field-label" for="newPassword">كلمة المرور الجديدة</label>
          <input class="field-input" id="newPassword" type="password" placeholder="8 أحرف على الأقل" required>
        </div>
        <div class="field">
          <label class="field-label" for="confirmPassword">تأكيد كلمة المرور</label>
          <input class="field-input" id="confirmPassword" type="password" placeholder="أعد إدخال كلمة المرور" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">تعيين كلمة المرور</button>
      </form>

      <p class="resend-row" style="margin-top: var(--sp-5);">
        <button type="button" id="resend-btn">إعادة إرسال الرمز</button>
      </p>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('vilue:app-ready', () => {
      const email = sessionStorage.getItem('vilue_reset_email');
      if (!email) { window.location.href = 'forgot-password.html'; return; }

      Vilue_Utils.qs('#resend-btn').addEventListener('click', async () => {
        try {
          await Vilue_Api.request('/auth/forgot-password', { method: 'POST', body: { email, lang: Vilue_I18n.getLang() } });
          Vilue_Utils.showToast('تم إرسال رمز جديد', 'success');
        } catch (err) {
          Vilue_Utils.showToast(err.message, 'error');
        }
      });

      Vilue_Utils.qs('#reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = Vilue_Utils.qs('#submit-btn');
        const code = Vilue_Utils.qs('#code').value.trim();
        const newPassword = Vilue_Utils.qs('#newPassword').value;
        const confirmPassword = Vilue_Utils.qs('#confirmPassword').value;

        if (code.length !== 6) { Vilue_Utils.showToast('أدخل الرمز كاملاً', 'error'); return; }
        if (newPassword.length < 8 || newPassword !== confirmPassword) {
          Vilue_Utils.showToast('كلمتا المرور غير متطابقتين أو أقصر من 8 أحرف', 'error');
          return;
        }

        Vilue_Utils.setLoading(submitBtn, true);
        try {
          await Vilue_Api.request('/auth/reset-password', { method: 'POST', body: { email, code, newPassword } });
          sessionStorage.removeItem('vilue_reset_email');
          Vilue_Utils.showToast('تم تغيير كلمة المرور، سجّل الدخول', 'success');
          setTimeout(() => { window.location.href = 'login.html'; }, 1200);
        } catch (err) {
          Vilue_Utils.showToast(
            err.code === 'OTP_INVALID' ? 'رمز غير صحيح' : err.message,
            'error'
          );
        } finally {
          Vilue_Utils.setLoading(submitBtn, false);
          submitBtn.textContent = 'تعيين كلمة المرور';
        }
      });
    });
  </script>
</body>
</html>
