<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | إضافة إعلان</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/marketplace.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="auth-form-screen">
    <div class="auth-form-top">
      <button class="back-btn" type="button" onclick="history.back()" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="auth-form-body">
      <h1 class="auth-title">إضافة إعلان جديد</h1>
      <p class="auth-subtitle" id="fee-note">سيتم تطبيق رسوم إدراج ثم يُراجع الإعلان قبل نشره.</p>

      <form id="sell-form" novalidate>
        <label class="mkt-image-upload" id="image-upload-label">
          <span id="upload-placeholder">اضغط لإضافة صورة (اختياري)</span>
          <input type="file" accept="image/*" id="image-input">
        </label>

        <div class="field" style="margin-top: var(--sp-4);">
          <label class="field-label" for="title">عنوان الإعلان</label>
          <input class="field-input" id="title" type="text" maxlength="80" placeholder="مثال: دراجة هوائية شبه جديدة" required>
        </div>

        <div class="field">
          <label class="field-label" for="price">السعر (سلون)</label>
          <input class="field-input" id="price" type="number" min="1" step="1" placeholder="أدخل السعر" required>
        </div>

        <div class="field">
          <label class="field-label" for="category">التصنيف (اختياري)</label>
          <input class="field-input" id="category" type="text" placeholder="مثال: إلكترونيات">
        </div>

        <div class="field">
          <label class="field-label" for="description">الوصف (اختياري)</label>
          <input class="field-input" id="description" type="text" maxlength="1000" placeholder="تفاصيل إضافية عن المنتج">
        </div>

        <div class="field checkbox-row">
          <input type="checkbox" id="isDigital">
          <label for="isDigital">منتج رقمي (يُسلَّم تلقائياً فور الشراء — مثل كود أو رصيد)</label>
        </div>

        <div class="field" id="delivery-field" style="display:none;">
          <label class="field-label" for="deliveryContent">المحتوى اللي يستلمه المشتري</label>
          <input class="field-input" id="deliveryContent" type="text" placeholder="مثال: كود التفعيل أو رابط التحميل">
          <span class="field-hint">يظهر هذا للمشتري بعد إتمام الدفع مباشرة، ولا يظهر لأي حد غيره</span>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">نشر الإعلان</button>
      </form>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/marketplace.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('vilue:app-ready', () => {
      if (!Vilue_Auth.isAuthenticated()) { window.location.href = 'login.html'; return; }

      const isDigitalCheckbox = Vilue_Utils.qs('#isDigital');
      const deliveryField = Vilue_Utils.qs('#delivery-field');
      isDigitalCheckbox.addEventListener('change', () => {
        deliveryField.style.display = isDigitalCheckbox.checked ? 'block' : 'none';
      });

      const imageInput = Vilue_Utils.qs('#image-input');
      const uploadLabel = Vilue_Utils.qs('#image-upload-label');
      let imageBase64 = null;

      imageInput.addEventListener('change', async () => {
        imageBase64 = await Vilue_Marketplace.readImageAsBase64(imageInput);
        if (imageBase64) {
          uploadLabel.innerHTML = `<img src="${imageBase64}" alt=""><input type="file" accept="image/*" id="image-input">`;
        }
      });

      Vilue_Utils.qs('#sell-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = Vilue_Utils.qs('#submit-btn');
        const title = Vilue_Utils.qs('#title').value.trim();
        const price = Number(Vilue_Utils.qs('#price').value);
        const category = Vilue_Utils.qs('#category').value.trim();
        const description = Vilue_Utils.qs('#description').value.trim();
        const isDigital = isDigitalCheckbox.checked;
        const deliveryContent = Vilue_Utils.qs('#deliveryContent').value.trim();

        if (title.length < 3) { Vilue_Utils.showToast('العنوان قصير جداً', 'error'); return; }
        if (!price || price <= 0) { Vilue_Utils.showToast('أدخل سعراً صحيحاً', 'error'); return; }
        if (isDigital && !deliveryContent) { Vilue_Utils.showToast('أدخل المحتوى اللي يستلمه المشتري', 'error'); return; }

        Vilue_Utils.setLoading(submitBtn, true);
        try {
          await Vilue_Marketplace.create({ title, description, priceSlon: price, category, imageBase64, isDigital, deliveryContent });
          Vilue_Utils.showToast('تم إرسال الإعلان للمراجعة', 'success');
          setTimeout(() => { window.location.href = 'marketplace.html'; }, 1200);
        } catch (err) {
          Vilue_Utils.showToast(
            err.code === 'INSUFFICIENT_BALANCE' ? 'رصيدك غير كافٍ لدفع رسوم الإدراج' : err.message,
            'error'
          );
        } finally {
          Vilue_Utils.setLoading(submitBtn, false);
          submitBtn.textContent = 'نشر الإعلان';
        }
      });
    });
  </script>
</body>
</html>
