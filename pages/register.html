<script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    async function populateGovernorates() {
      try {
        const lang = (window.Vilue_I18n && typeof Vilue_I18n.getLang === 'function') ? Vilue_I18n.getLang() : 'ar';
        const res = await fetch(`/locales/${lang}.json`);
        const dict = await res.json();
        const select = Vilue_Utils.qs('#governorate');
        if (!select) return;
        
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = (window.Vilue_I18n && typeof Vilue_I18n.t === 'function') 
          ? Vilue_I18n.t('auth.governoratePlaceholder') 
          : 'اختر المحافظة';
        placeholder.disabled = true;
        placeholder.selected = true;
        select.innerHTML = '';
        select.appendChild(placeholder);
        
        (dict.governorates || []).forEach((gov) => {
          const opt = document.createElement('option');
          opt.value = gov;
          opt.textContent = gov;
          select.appendChild(opt);
        });
      } catch (e) {
        console.error("Error loading governorates:", e);
      }
    }

    async function initRegisterForm() {
      await populateGovernorates();
      document.addEventListener('vilue:language-changed', populateGovernorates);

      const form = Vilue_Utils.qs('#register-form');
      const submitBtn = Vilue_Utils.qs('#register-submit');

      if (!form) return;

      form.addEventListener('submit', async (e) => {
        // حماية فائقة لمنع تحديث الصفحة نهائياً
        e.preventDefault();
        e.stopPropagation();

        const name = Vilue_Utils.qs('#name').value.trim();
        const contact = Vilue_Utils.qs('#contact').value.trim();
        const password = Vilue_Utils.qs('#password').value;
        const confirmPassword = Vilue_Utils.qs('#confirmPassword').value;
        const governorate = Vilue_Utils.qs('#governorate').value;
        const referralId = Vilue_Utils.qs('#referralId').value.trim();
        const termsAccepted = Vilue_Utils.qs('#terms').checked;

        const contactError = Vilue_Utils.qs('#contact-error');
        const confirmError = Vilue_Utils.qs('#confirm-error');
        const referralError = Vilue_Utils.qs('#referral-error');
        [contactError, confirmError, referralError].forEach((el) => { if (el) el.hidden = true; });

        let hasError = false;

        if (!Vilue_Utils.isValidEmail(contact)) {
          contactError.textContent = Vilue_I18n.getLang() === 'ar'
            ? 'أدخل بريداً إلكترونياً صحيحاً'
            : 'Enter a valid email address';
          contactError.hidden = false;
          hasError = true;
        }
        if (password !== confirmPassword || password.length < 8) {
          confirmError.textContent = Vilue_I18n.getLang() === 'ar'
            ? 'كلمتا المرور غير متطابقتين أو أقصر من 8 أحرف'
            : 'Passwords do not match or are shorter than 8 characters';
          confirmError.hidden = false;
          hasError = true;
        }
        if (!/^\d{6,12}$/.test(referralId)) {
          referralError.textContent = 'أدخل معرّفاً صحيحاً (أرقام فقط)';
          referralError.hidden = false;
          hasError = true;
        }
        if (!name || !governorate || !termsAccepted) {
          Vilue_Utils.showToast(Vilue_I18n.t('common.required'), 'error');
          hasError = true;
        }

        if (hasError) return false;

        Vilue_Utils.setLoading(submitBtn, true);
        try {
          const result = await Vilue_Auth.register({
            name, email: contact, password, referralId,
            country: 'IQ', governorate, lang: Vilue_I18n.getLang(),
          });
          sessionStorage.setItem('vilue_pending_user_id', result.userId);
          sessionStorage.setItem('vilue_pending_contact', contact);
          window.location.href = 'verify.html';
        } catch (err) {
          if (err.code === 'DUPLICATE_ACCOUNT') {
            contactError.textContent = Vilue_I18n.getLang() === 'ar'
              ? 'هذا الحساب مستخدم بالفعل'
              : 'This account already exists';
            contactError.hidden = false;
          } else if (err.code === 'REFERRAL_NOT_FOUND' || err.code === 'REFERRAL_REQUIRED') {
            referralError.textContent = err.code === 'REFERRAL_NOT_FOUND'
              ? 'لا يوجد مستخدم بهذا المعرّف'
              : 'رمز الإحالة مطلوب';
            referralError.hidden = false;
          } else {
            Vilue_Utils.showToast(err.message || 'حدث خطأ غير متوقع', 'error');
          }
        } finally {
          Vilue_Utils.setLoading(submitBtn, false);
        }
      });
    }

    // التنفيذ فور تحميل الصفحة لضمان ربط النموذج سواء كان app-ready انطلق أم لا
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initRegisterForm);
    } else {
      initRegisterForm();
    }
  </script>
