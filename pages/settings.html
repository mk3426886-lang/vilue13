<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | الإعدادات</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn" onclick="history.back()" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="topbar-brand" style="font-size:17px;">الإعدادات</div>
      <div style="width:40px;"></div>
    </header>

    <div class="container">
      <div class="section-header"><h2 data-i18n="settings.language">اللغة</h2></div>
      <div class="card" style="display:flex; align-items:center; justify-content:space-between;">
        <div>
          <div style="font-weight:700; font-size: var(--fs-sm);" data-i18n="settings.language">اللغة</div>
          <div style="color:var(--color-text-muted); font-size:var(--fs-xs); margin-top:2px;" data-i18n="settings.languageSubtitle">اختر لغة واجهة التطبيق</div>
        </div>
        <div class="lang-switch">
          <button type="button" data-lang-option="ar">العربية</button>
          <button type="button" data-lang-option="en">English</button>
        </div>
      </div>

      <div class="section-header"><h2>الأمان</h2></div>
      <div class="profile-menu-group" style="margin-top:0;">
        <div class="profile-menu-item">
          <span class="pmi-label">التحقق بخطوتين (2FA)</span>
          <label class="toggle"><input type="checkbox" id="twofa-toggle"><span class="toggle-track"></span></label>
        </div>
      </div>
      <p style="font-size: var(--fs-xs); color: var(--color-text-muted); margin: var(--sp-2) 0 0; padding: 0 var(--sp-1);">
        عند التفعيل، سيُطلب منك رمز تحقق يرسل لإيميلك قبل كل عملية سحب أو تحويل.
      </p>

      <div class="section-header"><h2>الخصوصية</h2></div>
      <div class="profile-menu-group" style="margin-top:0;">
        <div class="profile-menu-item">
          <span class="pmi-label">استقبال طلبات الصداقة</span>
          <label class="toggle"><input type="checkbox" id="friend-requests-toggle"><span class="toggle-track"></span></label>
        </div>
        <div class="profile-menu-item">
          <span class="pmi-label" style="opacity:.55;">استقبال الهدايا</span>
          <span style="font-size:11px; color:var(--c-gray-500); font-weight:700;">قريباً</span>
        </div>
      </div>

      <div class="section-header"><h2>الدعم</h2></div>
      <div class="card">
        <p style="font-size: var(--fs-xs); color: var(--color-text-muted); margin-bottom: var(--sp-3);">
          عندك مشكلة أو سؤال؟ راسل فريق الدعم وبنرد عليك (يظهر ردنا كإشعار داخل التطبيق).
        </p>
        <textarea id="support-message" class="field-input" rows="3" placeholder="اكتب رسالتك هنا..." style="resize:vertical; width:100%;"></textarea>
        <button class="btn btn-primary" id="support-send-btn" style="margin-top: var(--sp-3);">إرسال للدعم</button>
      </div>
    </div>
  </div>

  <style>
    .toggle { position: relative; display: inline-block; width: 42px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0; background: var(--c-bg-field);
      border-radius: var(--radius-full); transition: background var(--dur-fast) var(--ease);
    }
    .toggle-track::before {
      content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%;
      background: var(--c-white); top: 3px; inset-inline-start: 3px;
      box-shadow: var(--shadow-sm); transition: transform var(--dur-fast) var(--ease);
    }
    .toggle input:checked + .toggle-track { background: var(--c-navy-800); }
    .toggle input:checked + .toggle-track::before { transform: translateX(18px); }
    html[dir="rtl"] .toggle input:checked + .toggle-track::before { transform: translateX(-18px); }
  </style>

  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('vilue:app-ready', async () => {
      if (!Vilue_Auth.isAuthenticated()) { window.location.href = 'login.html'; return; }

      const user = await Vilue_Auth.loadSession();
      const toggle = Vilue_Utils.qs('#twofa-toggle');
      if (user) toggle.checked = !!user.twoFaEnabled;

      toggle.addEventListener('change', async () => {
        const desired = toggle.checked;
        toggle.disabled = true;
        try {
          await Vilue_Api.request('/users/me/2fa', {
            method: 'PATCH',
            headers: Vilue_Auth.authHeader(),
            body: { enabled: desired },
          });
          Vilue_Utils.showToast(desired ? 'تم تفعيل التحقق بخطوتين' : 'تم إيقاف التحقق بخطوتين', 'success');
        } catch (err) {
          toggle.checked = !desired;
          Vilue_Utils.showToast(err.message, 'error');
        } finally {
          toggle.disabled = false;
        }
      });

      const friendToggle = Vilue_Utils.qs('#friend-requests-toggle');
      if (user) friendToggle.checked = user.allowFriendRequests !== false;

      friendToggle.addEventListener('change', async () => {
        const desired = friendToggle.checked;
        friendToggle.disabled = true;
        try {
          await Vilue_Api.request('/users/me/friend-requests', {
            method: 'PATCH',
            headers: Vilue_Auth.authHeader(),
            body: { enabled: desired },
          });
          Vilue_Utils.showToast(desired ? 'صرت تستقبل طلبات الصداقة' : 'أوقفت استقبال طلبات الصداقة', 'success');
        } catch (err) {
          friendToggle.checked = !desired;
          Vilue_Utils.showToast(err.message, 'error');
        } finally {
          friendToggle.disabled = false;
        }
      });

      Vilue_Utils.qs('#support-send-btn').addEventListener('click', async () => {
        const textarea = Vilue_Utils.qs('#support-message');
        const message = textarea.value.trim();
        if (message.length < 3) {
          Vilue_Utils.showToast('اكتب رسالة أطول شوي', 'error');
          return;
        }
        try {
          await Vilue_Api.request('/support', { method: 'POST', headers: Vilue_Auth.authHeader(), body: { message } });
          textarea.value = '';
          Vilue_Utils.showToast('تم إرسال رسالتك، بيتواصل معك فريق الدعم قريباً', 'success');
        } catch (err) {
          Vilue_Utils.showToast(err.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
