<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | الحساب</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/profile.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-shell">
    <div class="profile-header">
      <div style="position:relative; width:78px; margin:0 auto;">
        <div class="avatar-lg" id="profile-avatar" style="cursor:pointer;">؟</div>
        <button id="avatar-edit-btn" aria-label="Change photo" style="all:unset; cursor:pointer; position:absolute; bottom:0; inset-inline-end:0; background:var(--c-pink-600); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; border:2px solid var(--c-navy-900);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 20h4l10.5-10.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 16v4Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <input type="file" id="avatar-input" accept="image/*" style="display:none;">
      </div>
      <div style="display:flex; align-items:center; justify-content:center; gap:8px;">
        <h1 id="profile-name">—</h1>
        <span id="profile-badge"></span>
        <button id="edit-name-btn" aria-label="Edit name" style="all:unset; cursor:pointer; color:rgba(255,255,255,0.7);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 20h4l10.5-10.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 16v4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="edit-name-form" style="display:none; margin-top:10px; gap:8px; justify-content:center; align-items:center;">
        <input id="edit-name-input" type="text" style="width:180px; padding:8px 12px; border-radius:10px; border:none; text-align:center;">
        <button id="save-name-btn" class="btn-sm btn-primary" style="padding:8px 14px;">حفظ</button>
      </div>
      <p class="uid">
        <span id="profile-uid">ID: —</span>
        <button id="copy-id-btn" aria-label="Copy ID" style="all:unset; cursor:pointer; margin-inline-start:6px; vertical-align:-2px; color:rgba(255,255,255,0.65);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
      </p>
    </div>

    <div class="container">
      <div class="profile-menu-group">
        <a class="profile-menu-item" href="settings.html">
          <span class="pmi-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.8"/><path d="M4 12h1M19 12h1M12 4v1M12 19v1M6.3 6.3l.7.7M17 17l.7.7M6.3 17.7l.7-.7M17 7l.7-.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <span class="pmi-label">الإعدادات</span>
          <span class="pmi-chevron">›</span>
        </a>
        <a class="profile-menu-item" href="#" id="admin-link" style="display:none;">
          <span class="pmi-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
          <span class="pmi-label">لوحة تحكم الأدمن</span>
          <span class="pmi-chevron">›</span>
        </a>
      </div>

      <div class="section-header"><h2>معلومات الحساب</h2></div>
      <div class="card" style="display:flex; flex-direction:column; gap: var(--sp-3);">
        <div class="info-row">
          <span class="info-label">البريد الإلكتروني</span>
          <span class="info-value" id="profile-email">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">المحافظة</span>
          <span class="info-value" id="profile-governorate">—</span>
        </div>
      </div>

      <div class="section-header"><h2>رمز الإحالة</h2></div>
      <div class="card" style="text-align:center;">
        <p style="font-size: var(--fs-xs); color: var(--color-text-muted); margin-bottom: var(--sp-2);">شارك معرّفك مع أصدقائك ليستخدموه عند إنشاء حسابهم</p>
        <div style="font-size: 22px; font-weight: 800; color: var(--color-primary); margin-bottom: var(--sp-2);" id="referral-count">—</div>
        <p style="font-size: var(--fs-xs); color: var(--color-text-muted);">شخص سجّل بمعرّفك</p>
      </div>

      <button class="btn btn-outline" id="logout-btn" style="margin-top: var(--sp-6); color: var(--c-danger); border-color: var(--c-danger);">تسجيل الخروج</button>
    </div>

    <nav class="bottom-nav">
      <a href="home.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9h12v-9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        الرئيسية
      </a>
      <a href="wallet.html">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 13h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        المحفظة
      </a>
      <a href="tasks.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3 8-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        المهام
      </a>
      <a href="friends.html">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.8"/><path d="M16 11l1.5 1.5L21 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        الأصدقاء
      </a>
      <a href="marketplace.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 8l8-4 8 4-8 4-8-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 8v8l8 4 8-4V8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        المتجر
      </a>
      <a href="profile.html" class="is-active">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="currentColor" stroke-width="1.8"/></svg>
        الحساب
      </a>
    </nav>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('vilue:app-ready', async () => {
      if (!Vilue_Auth.isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }

      const user = await Vilue_Auth.loadSession();
      if (user) {
        Vilue_Utils.qs('#profile-avatar').textContent = user.name ? user.name.trim().charAt(0) : '؟';
        if (user.avatarUrl) {
          Vilue_Utils.qs('#profile-avatar').style.backgroundImage = `url('${user.avatarUrl}')`;
          Vilue_Utils.qs('#profile-avatar').style.backgroundSize = 'cover';
          Vilue_Utils.qs('#profile-avatar').style.backgroundPosition = 'center';
          Vilue_Utils.qs('#profile-avatar').textContent = '';
        }
        Vilue_Utils.qs('#profile-name').textContent = user.name || '—';
        Vilue_Utils.qs('#profile-badge').innerHTML = Vilue_Utils.badgeHtml(user.verificationBadge);
        Vilue_Utils.qs('#profile-uid').textContent = `ID: ${user.userId || '—'}`;
        Vilue_Utils.qs('#referral-count').textContent = user.referralCount !== undefined ? Vilue_Utils.formatSlon(user.referralCount) : '0';
        Vilue_Utils.qs('#profile-email').textContent = user.email || '—';
        Vilue_Utils.qs('#profile-governorate').textContent = user.governorate || '—';
        if (user.isAdmin) Vilue_Utils.qs('#admin-link').style.display = 'flex';
      }

      Vilue_Utils.qs('#admin-link').addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = '../admin/dashboard/index.html';
      });

      Vilue_Utils.qs('#copy-id-btn').addEventListener('click', async () => {
        const idText = (user && user.userId) || '';
        if (!idText) return;
        try {
          await navigator.clipboard.writeText(idText);
          Vilue_Utils.showToast('تم نسخ المعرّف', 'success');
        } catch (e) {
          Vilue_Utils.showToast('تعذّر النسخ', 'error');
        }
      });

      const avatarInput = Vilue_Utils.qs('#avatar-input');
      const openAvatarPicker = () => avatarInput.click();
      Vilue_Utils.qs('#profile-avatar').addEventListener('click', openAvatarPicker);
      Vilue_Utils.qs('#avatar-edit-btn').addEventListener('click', openAvatarPicker);

      avatarInput.addEventListener('change', () => {
        const file = avatarInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const result = await Vilue_Api.request('/users/me/avatar', {
              method: 'POST', headers: Vilue_Auth.authHeader(), body: { imageBase64: reader.result },
            });
            const avatarEl = Vilue_Utils.qs('#profile-avatar');
            avatarEl.style.backgroundImage = `url('${result.avatarUrl}')`;
            avatarEl.style.backgroundSize = 'cover';
            avatarEl.style.backgroundPosition = 'center';
            avatarEl.textContent = '';
            Vilue_Utils.showToast('تم تحديث صورة الحساب', 'success');
          } catch (err) {
            Vilue_Utils.showToast(err.message, 'error');
          }
        };
        reader.readAsDataURL(file);
      });

      const editBtn = Vilue_Utils.qs('#edit-name-btn');
      const editForm = Vilue_Utils.qs('#edit-name-form');
      const editInput = Vilue_Utils.qs('#edit-name-input');
      const nameHeading = Vilue_Utils.qs('#profile-name');

      editBtn.addEventListener('click', () => {
        editInput.value = nameHeading.textContent.trim();
        editForm.style.display = 'flex';
      });

      Vilue_Utils.qs('#save-name-btn').addEventListener('click', async () => {
        const newName = editInput.value.trim();
        if (newName.length < 2) {
          Vilue_Utils.showToast('الاسم قصير جداً', 'error');
          return;
        }
        try {
          await Vilue_Api.request('/users/me/name', {
            method: 'PATCH', headers: Vilue_Auth.authHeader(), body: { name: newName },
          });
          nameHeading.textContent = newName;
          Vilue_Utils.qs('#profile-avatar').textContent = newName.charAt(0);
          editForm.style.display = 'none';
          Vilue_Utils.showToast('تم تحديث الاسم', 'success');
        } catch (err) {
          Vilue_Utils.showToast(err.message, 'error');
        }
      });

      Vilue_Utils.qs('#logout-btn').addEventListener('click', () => {
        Vilue_Auth.logout();
        window.location.href = 'login.html';
      });
    });
  </script>
</body>
</html>
