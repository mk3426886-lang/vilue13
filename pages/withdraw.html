<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | سحب</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="auth-form-screen">
    <div class="auth-form-top">
      <button class="back-btn" type="button" onclick="history.back()" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="auth-form-body">
      <h1 class="auth-title">سحب رصيد</h1>
      <p class="auth-subtitle" id="balance-line">الرصيد المتاح: —</p>

      <div class="method-grid" id="method-grid">
        <button type="button" class="method-card is-disabled" data-method="zaincash">
          <span class="method-name">زين كاش</span>
          <span class="method-badge">متوقف مؤقتاً</span>
        </button>
        <button type="button" class="method-card is-active" data-method="superqi">
          <span class="method-name">سوبر كي</span>
        </button>
        <button type="button" class="method-card is-disabled" data-method="mastercard">
          <span class="method-name">ماستركارد</span>
          <span class="method-badge">قريباً</span>
        </button>
      </div>

      <form id="withdraw-form" novalidate>
        <div class="field">
          <label class="field-label" for="amount">المبلغ (سلون)</label>
          <input class="field-input" id="amount" type="number" min="1" step="1" placeholder="أدخل المبلغ بالسلون" required>
          <span class="field-hint" id="iqd-hint"></span>
        </div>

        <div class="field">
          <label class="field-label" for="accountName">اسم صاحب حساب سوبر كي</label>
          <input class="field-input" id="accountName" type="text" placeholder="الاسم كما يظهر بحساب سوبر كي" required>
        </div>

        <div class="field">
          <label class="field-label" for="phone">رقم الهاتف</label>
          <input class="field-input" id="phone" type="tel" placeholder="07xxxxxxxxx" required dir="ltr">
          <span class="field-error" id="phone-error" hidden>أدخل رقم هاتف عراقي صحيح (07 ويتكون من 11 رقم)</span>
        </div>

        <div class="field">
          <label class="field-label" for="transferNumber">رقم التحويل (حساب سوبر كي المستلِم)</label>
          <input class="field-input" id="transferNumber" type="text" placeholder="رقم حساب سوبر كي المستلِم" required dir="ltr">
        </div>

        <div id="twofa-block" style="display:none;">
          <div class="field">
            <label class="field-label" for="twofa-code">رمز التحقق (2FA)</label>
            <div class="field-with-action">
              <input class="field-input" id="twofa-code" type="text" inputmode="numeric" maxlength="6" placeholder="أدخل الرمز المرسل لإيميلك" dir="ltr">
              <button type="button" class="field-action" id="send-code-btn" style="all:unset; position:absolute; inset-inline-end:12px; top:50%; transform:translateY(-50%); font-size:12px; font-weight:700; color:var(--color-primary); cursor:pointer;">إرسال الرمز</button>
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--sp-4); font-size: var(--fs-xs); color: var(--color-text-muted);">
          يمكنك إلغاء طلب السحب خلال 15 دقيقة من إرساله ما لم تتم الموافقة عليه بعد.
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">إرسال طلب السحب</button>
      </form>
    </div>
  </div>

  <style>
    .method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); margin-bottom: var(--sp-6); }
    .method-card {
      background: var(--c-white); border: 1.5px solid var(--color-border); border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-2); font-size: var(--fs-xs); font-weight: 700; color: var(--color-text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;
    }
    .method-card.is-active { border-color: var(--color-primary); color: var(--color-primary); background: rgba(11,19,48,0.04); }
    .method-card.is-disabled { opacity: 0.55; }
    .method-badge { font-size: 9px; background: var(--c-bg-field); padding: 2px 6px; border-radius: var(--radius-full); }
  </style>

  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/wallet.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('vilue:app-ready', async () => {
      if (!Vilue_Auth.isAuthenticated()) { window.location.href = 'login.html'; return; }

      const user = await Vilue_Auth.loadSession();
      if (user && user.twoFaEnabled) {
        Vilue_Utils.qs('#twofa-block').style.display = 'block';
      }

      try {
        const wallet = await Vilue_Wallet.getMyWallet();
        Vilue_Utils.qs('#balance-line').textContent = `الرصيد المتاح: ${Vilue_Utils.formatSlon(wallet.balanceSlon)} سلون`;
      } catch (e) { /* leave default text */ }

      Vilue_Utils.qsa('.method-card').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.classList.contains('is-disabled')) {
            const msg = btn.dataset.method === 'zaincash'
              ? 'سحب زين كاش متوقف مؤقتاً، استخدم سوبر كي'
              : 'طريقة ماستركارد قادمة قريباً';
            Vilue_Utils.showToast(msg, 'default');
          }
        });
      });

      const amountInput = Vilue_Utils.qs('#amount');
      const iqdHint = Vilue_Utils.qs('#iqd-hint');
      amountInput.addEventListener('input', () => {
        const v = Number(amountInput.value) || 0;
        iqdHint.textContent = v ? `≈ ${Vilue_Utils.formatSlon(v / 5)} دينار عراقي` : '';
      });

      Vilue_Utils.qs('#send-code-btn').addEventListener('click', async (e) => {
        e.preventDefault();
        const btn = e.currentTarget;
        btn.disabled = true;
        try {
          await Vilue_Wallet.sendTwoFactorCode();
          Vilue_Utils.showToast('تم إرسال رمز التحقق لإيميلك', 'success');
          let cooldown = 30;
          const timer = setInterval(() => {
            cooldown -= 1;
            btn.textContent = `إعادة الإرسال (${cooldown})`;
            if (cooldown <= 0) { clearInterval(timer); btn.textContent = 'إرسال الرمز'; btn.disabled = false; }
          }, 1000);
        } catch (err) {
          Vilue_Utils.showToast(err.message, 'error');
          btn.disabled = false;
        }
      });

      Vilue_Utils.qs('#withdraw-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = Vilue_Utils.qs('#submit-btn');
        const amountSlon = Number(amountInput.value);
        const accountName = Vilue_Utils.qs('#accountName').value.trim();
        const phone = Vilue_Utils.qs('#phone').value.trim();
        const transferNumber = Vilue_Utils.qs('#transferNumber').value.trim();
        const code = Vilue_Utils.qs('#twofa-code').value.trim();
        const phoneError = Vilue_Utils.qs('#phone-error');
        phoneError.hidden = true;

        if (!amountSlon || amountSlon <= 0) {
          Vilue_Utils.showToast('أدخل مبلغاً صحيحاً', 'error');
          return;
        }
        if (!accountName) {
          Vilue_Utils.showToast('أدخل اسم صاحب حساب سوبر كي', 'error');
          return;
        }
        if (!Vilue_Utils.isValidIraqiPhone(phone)) {
          phoneError.hidden = false;
          return;
        }
        if (!transferNumber) {
          Vilue_Utils.showToast('أدخل رقم التحويل (حساب سوبر كي المستلِم)', 'error');
          return;
        }

        Vilue_Utils.setLoading(submitBtn, true);
        try {
          await Vilue_Wallet.withdraw({ amountSlon, method: 'superqi', accountName, phone, transferNumber, code: code || undefined });
          Vilue_Utils.showToast('تم إرسال طلب السحب، بانتظار المراجعة', 'success');
          setTimeout(() => { window.location.href = 'wallet.html'; }, 1200);
        } catch (err) {
          if (err.code === 'TWO_FA_REQUIRED') {
            Vilue_Utils.qs('#twofa-block').style.display = 'block';
            Vilue_Utils.showToast('أدخل رمز التحقق أولاً', 'error');
          } else if (err.code === 'INSUFFICIENT_BALANCE') {
            Vilue_Utils.showToast('رصيدك غير كافٍ لإتمام هذا السحب', 'error');
          } else {
            Vilue_Utils.showToast(err.message, 'error');
          }
        } finally {
          Vilue_Utils.setLoading(submitBtn, false);
        }
      });
    });
  </script>
</body>
</html>
