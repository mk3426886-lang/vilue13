<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | إيداع</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="auth-form-screen">
    <div class="auth-form-top">
      <button class="back-btn" type="button" onclick="history.back()" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="auth-form-body">
      <h1 class="auth-title">إيداع رصيد</h1>
      <p class="auth-subtitle">اختر طريقة الإيداع وأدخل المبلغ</p>

      <div class="method-grid" id="method-grid">
        <button type="button" class="method-card is-disabled" data-method="zaincash">
          <span class="method-name">زين كاش</span>
          <span class="method-badge">متوقف مؤقتاً</span>
        </button>
        <button type="button" class="method-card is-active" data-method="superqi">
          <span class="method-name">سوبر كي</span>
        </button>
        <button type="button" class="method-card is-disabled" data-method="mastercard">
          <span class="method-name">ماستركارد</span>
          <span class="method-badge">قريباً</span>
        </button>
      </div>

      <form id="deposit-form" novalidate>
        <div class="field">
          <label class="field-label" for="amount">المبلغ (سلون)</label>
          <input class="field-input" id="amount" type="number" min="1" step="1" placeholder="أدخل المبلغ بالسلون" required>
          <span class="field-hint" id="iqd-hint"></span>
        </div>

        <div id="manual-review-fields">
          <div class="card" style="margin-bottom: var(--sp-4); font-size: var(--fs-sm); color: var(--color-text-muted);">
            <div id="receiving-account-info"></div>
          </div>

          <div class="field">
            <label class="field-label" for="senderName">اسم صاحب الحساب المُرسِل منه</label>
            <input class="field-input" id="senderName" type="text" placeholder="الاسم كما يظهر بحساب التحويل" required>
          </div>

          <div class="field">
            <label class="field-label" for="note">ملاحظة (اختياري)</label>
            <input class="field-input" id="note" type="text" placeholder="أي تفاصيل إضافية">
          </div>

          <div class="card" style="margin-bottom: var(--sp-4); font-size: var(--fs-xs); color: var(--color-text-muted);">
            سيراجع فريق فيليو طلبك خلال وقت قصير بعد التأكد من استلام التحويل.
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">إرسال طلب الإيداع</button>
      </form>
    </div>
  </div>

  <style>
    .method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); margin-bottom: var(--sp-6); }
    .method-card {
      background: var(--c-white); border: 1.5px solid var(--color-border); border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-2); font-size: var(--fs-xs); font-weight: 700; color: var(--color-text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;
    }
    .method-card.is-active { border-color: var(--color-primary); color: var(--color-primary); background: rgba(11,19,48,0.04); }
    .method-card.is-disabled { opacity: 0.55; }
    .method-badge { font-size: 9px; background: var(--c-bg-field); padding: 2px 6px; border-radius: var(--radius-full); }
  </style>

  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/wallet.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const RECEIVING_INFO = {
      superqi: 'حوّل المبلغ المكافئ بالدينار العراقي إلى حساب سوبر كي: <strong dir="ltr">917390121577</strong>، ثم عبّي التفاصيل تحت.',
    };
    const DISABLED_MESSAGES = {
      zaincash: 'إيداع زين كاش متوقف مؤقتاً، استخدم سوبر كي',
      mastercard: 'طريقة ماستركارد قادمة قريباً',
    };

    document.addEventListener('vilue:app-ready', () => {
      if (!Vilue_Auth.isAuthenticated()) { window.location.href = 'login.html'; return; }

      let selectedMethod = 'superqi';
      const manualFields = Vilue_Utils.qs('#manual-review-fields');
      const infoBox = Vilue_Utils.qs('#receiving-account-info');
      const amountInput = Vilue_Utils.qs('#amount');
      const iqdHint = Vilue_Utils.qs('#iqd-hint');

      function updateMethodUI() {
        Vilue_Utils.qsa('.method-card').forEach((btn) => {
          btn.classList.toggle('is-active', btn.dataset.method === selectedMethod);
        });
        manualFields.style.display = selectedMethod === 'mastercard' ? 'none' : 'block';
        infoBox.innerHTML = RECEIVING_INFO[selectedMethod] || '';
      }

      Vilue_Utils.qsa('.method-card').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.classList.contains('is-disabled')) {
            Vilue_Utils.showToast(DISABLED_MESSAGES[btn.dataset.method] || 'هذه الطريقة غير متاحة حالياً', 'default');
            return;
          }
          selectedMethod = btn.dataset.method;
          updateMethodUI();
        });
      });
      updateMethodUI();

      amountInput.addEventListener('input', () => {
        const v = Number(amountInput.value) || 0;
        iqdHint.textContent = v ? `≈ ${Vilue_Utils.formatSlon(v / 5)} دينار عراقي` : '';
      });

      Vilue_Utils.qs('#deposit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = Vilue_Utils.qs('#submit-btn');
        const amountSlon = Number(amountInput.value);
        const senderAccountName = Vilue_Utils.qs('#senderName').value.trim();
        const note = Vilue_Utils.qs('#note').value.trim();

        if (!amountSlon || amountSlon <= 0) {
          Vilue_Utils.showToast('أدخل مبلغاً صحيحاً', 'error');
          return;
        }
        if (selectedMethod !== 'mastercard' && !senderAccountName) {
          Vilue_Utils.showToast('أدخل اسم صاحب الحساب المُرسِل', 'error');
          return;
        }

        Vilue_Utils.setLoading(submitBtn, true);
        try {
          await Vilue_Wallet.deposit({ amountSlon, method: selectedMethod, senderAccountName, note });
          Vilue_Utils.showToast('تم إرسال طلب الإيداع، بانتظار المراجعة', 'success');
          setTimeout(() => { window.location.href = 'wallet.html'; }, 1200);
        } catch (err) {
          Vilue_Utils.showToast(err.message, 'error');
        } finally {
          Vilue_Utils.setLoading(submitBtn, false);
        }
      });
    });
  </script>
</body>
</html>
