<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | المحفظة</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/wallet.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <img class="brand-mark" src="../assets/icons/logo-mark.svg" alt="Vilue" width="30" height="30" style="border-radius:9px;">
        المحفظة
      </div>
    </header>

    <div class="container">
      <div class="balance-card">
        <div class="balance-label">الرصيد المتاح</div>
        <div class="balance-amount" id="balance-slon">—</div>
        <div class="balance-sub" id="balance-iqd">—</div>
      </div>

      <div class="quick-actions" style="grid-template-columns: repeat(3, 1fr);">
        <a class="quick-action" href="deposit.html" style="text-decoration:none;">
          <span class="qa-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          إيداع
        </a>
        <a class="quick-action" href="withdraw.html" style="text-decoration:none;">
          <span class="qa-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M12 19l-6-6M12 19l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          سحب
        </a>
        <a class="quick-action" href="transfer.html" style="text-decoration:none;">
          <span class="qa-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 8h13M7 8l4-4M7 8l4 4M17 16H4M17 16l-4-4M17 16l-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          تحويل
        </a>
      </div>

      <div class="section-header" style="margin-top: var(--sp-5);">
        <h2>المعاملات</h2>
      </div>
      <div id="tx-list">
        <div class="card" style="text-align:center; padding: var(--sp-8) var(--sp-5); color: var(--color-text-muted);">
          <p style="font-size: var(--fs-sm);">جارِ التحميل...</p>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9h12v-9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        الرئيسية
      </a>
      <a href="wallet.html" class="is-active">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 13h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        المحفظة
      </a>
      <a href="friends.html">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.8"/><path d="M16 11l1.5 1.5L21 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        الأصدقاء
      </a>
      <a href="marketplace.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 8l8-4 8 4-8 4-8-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 8v8l8 4 8-4V8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        المتجر
      </a>
      <a href="profile.html">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="currentColor" stroke-width="1.8"/></svg>
        الحساب
      </a>
    </nav>

    <div id="tx-modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(11,19,48,0.5); z-index:100; align-items:flex-end; justify-content:center;">
      <div style="background:var(--c-white); border-radius:20px 20px 0 0; max-width:480px; width:100%; max-height:80vh; overflow-y:auto; padding:var(--sp-5);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--sp-4);">
          <div style="font-weight:800; font-size:16px;">تفاصيل العملية</div>
          <button id="close-tx-modal-btn" style="all:unset; cursor:pointer; font-size:22px;">×</button>
        </div>
        <div id="tx-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/wallet.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const TX_LABELS = {
      deposit: 'إيداع', withdrawal: 'سحب', transfer_in: 'تحويل مستلم',
      transfer_out: 'تحويل مرسل', fee: 'رسوم', gift_sent: 'هدية مرسلة', gift_received: 'هدية مستلمة',
      purchase: 'شراء من المتجر', sale: 'بيع بالمتجر', marketplace_fee: 'رسوم إدراج',
      task_reserve: 'حجز مبلغ مهمة', task_refund: 'استرجاع مبلغ مهمة', task_reward: 'مكافأة مهمة', task_penalty: 'خصم مغادرة مهمة',
    };
    const STATUS_LABELS = {
      pending: 'قيد المراجعة', processing: 'قيد المعالجة', approved: 'تمت الموافقة',
      completed: 'مكتمل', rejected: 'مرفوض', cancelled: 'ملغى',
    };
    const INCOMING_TYPES = new Set(['deposit', 'transfer_in', 'gift_received']);

    let lastLoadedTransactions = [];

    function renderTransactions(rows) {
      lastLoadedTransactions = rows;
      const container = Vilue_Utils.qs('#tx-list');
      if (!rows.length) {
        container.innerHTML = `<div class="card" style="text-align:center; padding: var(--sp-8) var(--sp-5); color: var(--color-text-muted);">
          <p style="font-size: var(--fs-sm);">لا توجد معاملات بعد.</p></div>`;
        return;
      }

      container.innerHTML = rows.map((tx) => {
        const isIn = INCOMING_TYPES.has(tx.type);
        const sign = isIn ? '+' : '-';
        const iconClass = isIn ? 'in' : (tx.status === 'pending' || tx.status === 'processing' ? 'neutral' : 'out');
        const arrow = isIn
          ? '<path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
          : '<path d="M12 5v14M12 19l-6-6M12 19l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
        const date = new Date(tx.created_at).toLocaleString('ar-IQ', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
        const statusClass = tx.status === 'completed' ? 'completed' : (tx.status === 'pending' || tx.status === 'processing' ? 'pending' : 'completed');

        let cancelBtn = '';
        if (tx.type === 'withdrawal' && tx.status === 'pending' && tx.meta && tx.meta.cancel_until && new Date(tx.meta.cancel_until) > new Date()) {
          cancelBtn = `<button class="btn-sm btn-outline" data-cancel-id="${tx.id}" style="margin-top:6px; padding:4px 10px; font-size:11px;">إلغاء</button>`;
        }

        return `
          <div class="tx-row" style="align-items:flex-start; cursor:pointer;" data-details-id="${tx.id}">
            <div class="tx-icon ${iconClass}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none">${arrow}</svg></div>
            <div class="tx-info">
              <div class="tx-title">${TX_LABELS[tx.type] || tx.type}</div>
              <div class="tx-meta">${date}</div>
              ${cancelBtn}
            </div>
            <div style="text-align:end;">
              <div class="tx-amount ${isIn ? 'in' : 'out'}">‎${sign}${Vilue_Utils.formatSlon(tx.amount_slon)}</div>
              <span class="tx-status ${statusClass}">${STATUS_LABELS[tx.status] || tx.status}</span>
            </div>
          </div>`;
      }).join('');

      Vilue_Utils.qsa('[data-details-id]').forEach((row) => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('[data-cancel-id]')) return; // don't open details when cancelling
          openTxDetails(row.dataset.detailsId);
        });
      });

      Vilue_Utils.qsa('[data-cancel-id]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          btn.disabled = true;
          try {
            await Vilue_Wallet.cancelWithdrawal(btn.dataset.cancelId);
            Vilue_Utils.showToast('تم إلغاء طلب السحب وإرجاع المبلغ', 'success');
            loadEverything();
          } catch (err) {
            Vilue_Utils.showToast(err.message, 'error');
            btn.disabled = false;
          }
        });
      });
    }

    async function loadEverything() {
      try {
        const wallet = await Vilue_Wallet.getMyWallet();
        Vilue_Utils.qs('#balance-slon').innerHTML =
          `${Vilue_Utils.formatSlon(wallet.balanceSlon)} <span style="font-size:16px;">سلون</span>`;
        Vilue_Utils.qs('#balance-iqd').textContent =
          `≈ ${Vilue_Utils.formatSlon(wallet.balanceIqd)} دينار عراقي`;
      } catch (err) {
        Vilue_Utils.qs('#balance-slon').textContent = '—';
        Vilue_Utils.qs('#balance-iqd').textContent =
          err.code === 'BACKEND_UNREACHABLE' ? 'تعذّر الاتصال بالسيرفر' : 'تعذّر تحميل الرصيد';
      }

      try {
        const { transactions } = await Vilue_Wallet.getMyTransactions();
        renderTransactions(transactions);
      } catch (err) {
        Vilue_Utils.qs('#tx-list').innerHTML = `<div class="card" style="text-align:center; padding: var(--sp-6); color: var(--color-text-muted); font-size: var(--fs-sm);">تعذّر تحميل المعاملات</div>`;
      }
    }

    document.addEventListener('vilue:app-ready', async () => {
      if (!Vilue_Auth.isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      await loadEverything();

      Vilue_Utils.qs('#close-tx-modal-btn').addEventListener('click', () => {
        Vilue_Utils.qs('#tx-modal-overlay').style.display = 'none';
      });
    });

    function openTxDetails(txId) {
      const tx = lastLoadedTransactions.find((t) => t.id === txId);
      if (!tx) return;

      const rows = [
        ['النوع', TX_LABELS[tx.type] || tx.type],
        ['رقم العملية', `<span dir="ltr">${tx.id}</span>`],
        ['المبلغ', `${Vilue_Utils.formatSlon(tx.amount_slon)} سلون`],
        ['الرسوم', `${Vilue_Utils.formatSlon(tx.fee_slon || 0)} سلون`],
        ['الحالة', STATUS_LABELS[tx.status] || tx.status],
        ['التاريخ والوقت', new Date(tx.created_at).toLocaleString('ar-IQ')],
      ];

      if (tx.meta && tx.meta.method) {
        const methodLabels = { zaincash: 'زين كاش', superqi: 'سوبر كي', mastercard: 'ماستركارد' };
        rows.push(['طريقة الدفع', methodLabels[tx.meta.method] || tx.meta.method]);
      }
      if (tx.meta && tx.meta.phone) rows.push(['رقم الاستلام', `<span dir="ltr">${tx.meta.phone}</span>`]);
      if (tx.meta && tx.meta.sender_account_name) rows.push(['اسم المُرسِل', tx.meta.sender_account_name]);
      if (tx.meta && tx.meta.note) rows.push(['ملاحظة', tx.meta.note]);
      if (tx.meta && tx.meta.admin_note) rows.push(['ملاحظة الإدارة', tx.meta.admin_note]);
      if (tx.meta && tx.meta.cancel_until) {
        const stillCancellable = new Date(tx.meta.cancel_until) > new Date();
        rows.push(['يمكن الإلغاء حتى', new Date(tx.meta.cancel_until).toLocaleString('ar-IQ') + (stillCancellable ? '' : ' (انتهت المهلة)')]);
      }
      if (tx.reference_id) rows.push(['مرجع العملية', `<span dir="ltr">${tx.reference_id}</span>`]);

      Vilue_Utils.qs('#tx-modal-body').innerHTML = rows.map(([label, value]) => `
        <div style="display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--color-border); font-size:13px;">
          <span style="color:var(--color-text-muted);">${label}</span><strong style="text-align:end;">${value}</strong>
        </div>`).join('');

      Vilue_Utils.qs('#tx-modal-overlay').style.display = 'flex';
    }
  </script>
</body>
</html>
