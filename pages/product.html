<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vilue | تفاصيل المنتج</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/marketplace.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="auth-form-screen">
    <div class="auth-form-top">
      <button class="back-btn" type="button" onclick="history.back()" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="auth-form-body">
      <div class="mkt-detail-img" id="detail-img">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M4 8l8-4 8 4-8 4-8-4Z" stroke="currentColor" stroke-width="1.5"/><path d="M4 8v8l8 4 8-4V8" stroke="currentColor" stroke-width="1.5"/></svg>
      </div>

      <h1 class="auth-title" id="detail-title">—</h1>
      <div class="mkt-card-price" style="font-size: 24px; margin-bottom: var(--sp-2);" id="detail-price">—</div>
      <p style="color: var(--color-text-muted); font-size: var(--fs-sm); margin-bottom: var(--sp-6);" id="detail-description"></p>

      <button class="btn btn-primary" id="buy-btn">شراء الآن</button>
      <p style="text-align:center; font-size: var(--fs-xs); color: var(--color-text-muted); margin-top: var(--sp-3);" id="detail-status"></p>
      <p style="text-align:center; font-size: var(--fs-xs); color: var(--color-text-muted); margin-top: var(--sp-1);" id="detail-stock"></p>
      <button class="btn" id="delete-listing-btn" style="display:none; margin-top: var(--sp-4); background:var(--c-bg-field); color:var(--c-danger);">حذف الإعلان</button>
    </div>
  </div>

  <!-- شاشة تأكيد الشراء -->
  <div id="buy-confirm-overlay" style="display:none; position:fixed; inset:0; background:rgba(11,19,48,0.55); z-index:200; align-items:flex-end; justify-content:center;">
    <div style="background:#fff; width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:28px 22px 32px; text-align:center;">
      <h2 style="margin:0 0 6px; font-size:18px; color:var(--color-primary);">تأكيد الشراء</h2>
      <p style="margin:0 0 20px; font-size:13px; color:var(--color-text-muted);">تأكد من التفاصيل قبل إتمام الشراء</p>
      <div style="background:var(--c-bg-field); border-radius:16px; padding:16px; margin-bottom:20px; text-align:start;">
        <div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;"><span style="color:var(--color-text-muted);">المنتج</span><strong id="buy-confirm-title"></strong></div>
        <div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;"><span style="color:var(--color-text-muted);">السعر</span><strong id="buy-confirm-price" style="color:var(--color-primary);"></strong></div>
      </div>
      <div style="display:flex; gap:10px;">
        <button type="button" id="buy-confirm-cancel" class="btn" style="flex:1; background:var(--c-bg-field); color:var(--color-primary);">إلغاء</button>
        <button type="button" id="buy-confirm-ok" class="btn btn-primary" style="flex:1;">تأكيد الشراء</button>
      </div>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/marketplace.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('vilue:app-ready', async () => {
      const params = new URLSearchParams(location.search);
      const productId = params.get('id');
      if (!productId) { window.location.href = 'marketplace.html'; return; }

      const buyBtn = Vilue_Utils.qs('#buy-btn');
      const stockLine = Vilue_Utils.qs('#detail-stock');
      const confirmOverlay = Vilue_Utils.qs('#buy-confirm-overlay');
      const deleteBtn = Vilue_Utils.qs('#delete-listing-btn');
      let currentProduct = null;

      function showDeliveredCode(code) {
        Vilue_Utils.qs('#buy-btn').style.display = 'none';
        const box = document.createElement('div');
        box.className = 'card';
        box.style.marginTop = 'var(--sp-4)';
        box.innerHTML = `
          <div style="font-weight:700; font-size:13px; margin-bottom:8px;">🎉 هذا محتوى منتجك:</div>
          <div style="background:var(--c-bg-field); border-radius:10px; padding:12px; font-family:monospace; font-size:14px; word-break:break-all;">${code}</div>
          <button class="btn-sm btn-outline" id="copy-delivery-btn" style="margin-top:10px; width:100%;">نسخ</button>`;
        Vilue_Utils.qs('.auth-form-body').appendChild(box);
        Vilue_Utils.qs('#copy-delivery-btn').addEventListener('click', async () => {
          await navigator.clipboard.writeText(code);
          Vilue_Utils.showToast('تم النسخ', 'success');
        });
      }

      function showPurchaseSuccess() {
        Vilue_Utils.qs('#buy-btn').style.display = 'none';
        const box = document.createElement('div');
        box.className = 'card';
        box.style.marginTop = 'var(--sp-4)';
        box.style.textAlign = 'center';
        box.innerHTML = `<div style="font-weight:700; font-size:14px; color:var(--c-success, #16C784);">✓ تم الشراء بنجاح — هذا منتجك</div>`;
        Vilue_Utils.qs('.auth-form-body').appendChild(box);
      }

      function stockLabel(product) {
        if (product.quantity === null || product.quantity === undefined) return 'الكمية: غير محدودة';
        if (product.quantity <= 0) return 'نفذت الكمية';
        return `الكمية المتبقية: ${product.quantity}`;
      }

      try {
        const { product } = await Vilue_Marketplace.getProduct(productId);
        currentProduct = product;
        Vilue_Utils.qs('#detail-title').textContent = product.title;
        Vilue_Utils.qs('#detail-price').textContent = `${Vilue_Utils.formatSlon(product.price_slon)} سلون`;
        Vilue_Utils.qs('#detail-description').textContent = product.description || '';
        stockLine.textContent = stockLabel(product);
        if (product.image_url) {
          Vilue_Utils.qs('#detail-img').innerHTML = `<img src="${product.image_url}" alt="">`;
        }

        const outOfStock = product.quantity !== null && product.quantity !== undefined && product.quantity <= 0;
        if (product.status !== 'approved' || outOfStock) {
          buyBtn.disabled = true;
          buyBtn.textContent = outOfStock ? 'نفذت الكمية' : (product.status === 'sold' ? 'تم البيع' : 'غير متاح حالياً');
        }

        // Owner (or an admin) can remove the listing entirely.
        if (Vilue_Auth.isAuthenticated()) {
          const me = await Vilue_Auth.loadSession();
          if (me && (me.id === product.seller_id || me.isAdmin || me.isOwner)) {
            deleteBtn.style.display = 'block';
          }
        }

        // If the current user already bought this, show their code again
        // instead of making them wonder where it went — this is what
        // "سجل المشتريات" links back into.
        if (Vilue_Auth.isAuthenticated()) {
          try {
            const { orders } = await Vilue_Marketplace.myPurchases();
            const mine = orders.find((o) => o.product_id === productId);
            if (mine) {
              if (mine.code_value) showDeliveredCode(mine.code_value);
              else showPurchaseSuccess();
            }
          } catch (e) { /* non-critical */ }
        }
      } catch (err) {
        Vilue_Utils.qs('#detail-title').textContent = 'تعذّر تحميل المنتج';
        buyBtn.disabled = true;
      }

      buyBtn.addEventListener('click', () => {
        if (!Vilue_Auth.isAuthenticated()) {
          window.location.href = 'login.html';
          return;
        }
        if (!currentProduct) return;
        Vilue_Utils.qs('#buy-confirm-title').textContent = currentProduct.title;
        Vilue_Utils.qs('#buy-confirm-price').textContent = `${Vilue_Utils.formatSlon(currentProduct.price_slon)} سلون`;
        confirmOverlay.style.display = 'flex';
      });

      Vilue_Utils.qs('#buy-confirm-cancel').addEventListener('click', () => {
        confirmOverlay.style.display = 'none';
      });

      Vilue_Utils.qs('#buy-confirm-ok').addEventListener('click', async () => {
        const okBtn = Vilue_Utils.qs('#buy-confirm-ok');
        Vilue_Utils.setLoading(okBtn, true);
        try {
          const result = await Vilue_Marketplace.buy(productId);
          confirmOverlay.style.display = 'none';
          if (result.deliveryContent) {
            showDeliveredCode(result.deliveryContent);
          } else {
            showPurchaseSuccess();
          }
          Vilue_Utils.showToast('تم الشراء بنجاح', 'success');
        } catch (err) {
          confirmOverlay.style.display = 'none';
          const messages = {
            INSUFFICIENT_BALANCE: 'رصيدك غير كافٍ لإتمام هذا الشراء',
            CANNOT_BUY_OWN_LISTING: 'لا يمكنك شراء إعلانك الخاص',
            PRODUCT_NOT_AVAILABLE: 'هذا المنتج لم يعد متاحاً',
            OUT_OF_STOCK: 'نفذت الكمية المتاحة من هذا المنتج',
          };
          Vilue_Utils.showToast(messages[err.code] || err.message, 'error');
        } finally {
          Vilue_Utils.setLoading(okBtn, false);
        }
      });

      deleteBtn.addEventListener('click', async () => {
        if (!confirm('حذف هذا الإعلان نهائياً؟ هذا الإجراء لا يمكن التراجع عنه.')) return;
        Vilue_Utils.setLoading(deleteBtn, true);
        try {
          await Vilue_Marketplace.deleteListing(productId);
          Vilue_Utils.showToast('تم حذف الإعلان', 'success');
          setTimeout(() => { window.location.href = 'marketplace.html'; }, 1000);
        } catch (err) {
          Vilue_Utils.showToast(err.message, 'error');
          Vilue_Utils.setLoading(deleteBtn, false);
        }
      });
    });
  </script>
</body>
</html>
